; Defaults for a public-facing site. This image had NO php.ini at all - only the
; untouched -development/-production templates - so it ran on PHP's compiled defaults,
; which are meant for a developer's laptop rather than a web server.

; A stack trace rendered into the page tells a visitor nothing and tells an attacker the
; filesystem layout. Errors go to the container log instead: `docker logs <container>`.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The session cookie is the whole of a member's authentication on these sites. HttpOnly
; keeps it away from any script that gets onto the page; SameSite=Lax stops it riding
; along on cross-site requests. Both are safe regardless of how a site is served.
;
; cookie_secure is deliberately NOT set here: a site still served over plain HTTP would
; lose its sessions entirely. Pages that know they are on HTTPS set it themselves.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Without this PHP adopts whatever session id the client sends, so anyone who can plant
; a cookie can choose the session a visitor will use - and then read the CSRF token and
; anything else minted in it before login. The member gate regenerates the id on unlock,
; which defeats the classic fixation attack, but tokens created BEFORE that are still
; created in an attacker-chosen session. This makes PHP mint its own id instead.
session.use_strict_mode = 1

; Do not advertise the exact PHP build in every response header.
expose_php = Off
